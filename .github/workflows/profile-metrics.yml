name: Update Hasnain.OS GitHub Telemetry

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-24.04
    steps:
      - name: Generate GitHub metrics
        uses: lowlighter/metrics@latest
        with:
          filename: assets/github-metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: hasnain1522
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes

  contribution-matrix:
    needs: metrics
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest profile
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install image renderer
        run: python -m pip install --upgrade pillow

      - name: Generate animated contribution matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: hasnain1522
          OUTPUT: assets/github-contribution-matrix.gif
        run: python scripts/generate_contribution_matrix.py

      - name: Commit contribution matrix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add assets/github-contribution-matrix.gif
          if git diff --cached --quiet; then
            echo "No contribution matrix changes to commit."
          else
            git commit -m "chore: update contribution matrix"
            git push
          fi
